name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub release tag to upload APK to, for example v0.4.1'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Validate Android signing secrets
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are required to build installable update APKs."
            echo "Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub repository secrets."
            exit 1
          fi

      - name: Build and sync Android assets
        env:
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}
        run: npm run android:sync

      - name: Resolve Android version
        id: android_version
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}"
          CLEAN_VERSION="${VERSION#v}"
          if [[ "$CLEAN_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION_CODE=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
            echo "version_name=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
            echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          else
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            CLEAN_PACKAGE_VERSION="${PACKAGE_VERSION#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_PACKAGE_VERSION"
            VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
            echo "version_name=$CLEAN_PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
            echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Android signing key
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/alaalakasir-release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: app/alaalakasir-release.jks
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --info

      - name: Upload Android build reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/build/reports/**
            android/app/build/reports/**
          if-no-files-found: ignore

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'manual' }}"
          cp android/app/build/outputs/apk/release/app-release.apk "alaalakasir-${VERSION}-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alaalakasir-apk
          path: alaalakasir-*.apk

      - name: Upload APK to GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "AlaalaKasir $RELEASE_TAG" --notes "Android release APK build."
          gh release upload "$RELEASE_TAG" alaalakasir-*.apk --clobber
