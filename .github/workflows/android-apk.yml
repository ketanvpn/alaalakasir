name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub release tag to upload APK to, for example v0.1.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build and sync Android assets
        env:
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}
        run: npm run android:sync

      - name: Prepare Android signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/alaalakasir-release.jks

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: app/alaalakasir-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'manual' }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Build debug APK without signing secrets
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'manual' }}"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "alaalakasir-${VERSION}-release.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "alaalakasir-${VERSION}-debug.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alaalakasir-apk
          path: alaalakasir-*.apk

      - name: Upload APK to GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "AlaalaKasir $RELEASE_TAG" --notes "Android debug APK build."
          gh release upload "$RELEASE_TAG" alaalakasir-*.apk --clobber
