name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub release tag to upload APK to, for example v0.4.1'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Validate Android signing secrets
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are required to build installable update APKs."
            echo "Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub repository secrets."
            exit 1
          fi

      - name: Build and sync Android assets
        env:
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}
        run: npm run android:sync

      - name: Resolve Android version
        id: android_version
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}"
          CLEAN_VERSION="${VERSION#v}"
          if [[ "$CLEAN_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            VERSION_CODE=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
            echo "version_name=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
            echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          else
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            CLEAN_PACKAGE_VERSION="${PACKAGE_VERSION#v}"
            if [[ ! "$CLEAN_PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid app version format: $CLEAN_PACKAGE_VERSION"
              echo "Use semantic version format, example: 0.4.9, 0.10.0, or 1.0.0"
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_PACKAGE_VERSION"
            VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
            echo "version_name=$CLEAN_PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
            echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Android signing key
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/alaalakasir-release.jks

      - name: Verify Android signing key
        run: |
          if ! keytool -list -keystore android/app/alaalakasir-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null; then
            echo "Failed to read the keystore or alias. Check ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS."
            exit 1
          fi

          if ! keytool -certreq -keystore android/app/alaalakasir-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" -file /tmp/alaalakasir-release.csr >/dev/null; then
            echo "Failed to access the private key. Check ANDROID_KEY_PASSWORD."
            exit 1
          fi

          rm -f /tmp/alaalakasir-release.csr
          echo "Android signing key verified."

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: alaalakasir-release.jks
          ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --info 2>&1 | tee ../android-gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload Android build reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android-gradle-build.log
            android/build/reports/**
            android/app/build/reports/**
          if-no-files-found: ignore

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'manual' }}"
          cp android/app/build/outputs/apk/release/app-release.apk "alaalakasir-${VERSION}-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alaalakasir-apk
          path: alaalakasir-*.apk

      - name: Upload APK to GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          RAW_TAG="$RELEASE_TAG"
          CLEAN_TAG="$(printf '%s' "$RAW_TAG" | tr -d '\r' | xargs)"
          CLEAN_TAG="${CLEAN_TAG#refs/tags/}"
          CLEAN_TAG="${CLEAN_TAG#\"}"
          CLEAN_TAG="${CLEAN_TAG%\"}"
          CLEAN_TAG="${CLEAN_TAG#\'}"
          CLEAN_TAG="${CLEAN_TAG%\'}"

          if [[ ! "$CLEAN_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: '$RAW_TAG'"
            echo "Use semantic version tag format, example: v0.4.9, v0.10.0, or v1.0.0"
            exit 1
          fi

          gh release view "$CLEAN_TAG" || gh release create "$CLEAN_TAG" --title "AlaalaKasir $CLEAN_TAG" --notes "Android release APK build."
          gh release upload "$CLEAN_TAG" alaalakasir-*.apk --clobber
