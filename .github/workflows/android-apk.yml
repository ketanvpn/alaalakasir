name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub release tag to upload APK to, for example v0.1.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build and sync Android assets
        env:
          VITE_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || 'manual' }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "alaalakasir-${VERSION}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alaalakasir-debug-apk
          path: alaalakasir-*-debug.apk

      - name: Upload APK to GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "AlaalaKasir $RELEASE_TAG" --notes "Android debug APK build."
          gh release upload "$RELEASE_TAG" alaalakasir-*-debug.apk --clobber
